name: Email MatePad Update APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'matepad-app/**'
      - '.github/workflows/email-matepad-update.yml'

jobs:
  email-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build MatePad debug APK
        run: gradle -p matepad-app assembleDebug

      - name: Prepare mail attachment
        run: |
          mkdir -p update-mail
          APK_PATH=$(ls matepad-app/app/build/outputs/apk/debug/*.apk | head -n 1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' matepad-app/app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' matepad-app/app/build.gradle.kts | head -n 1)
          cp "$APK_PATH" "update-mail/PostBird-MatePad-v${VERSION_NAME}-code${VERSION_CODE}.apk.bin"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ATTACHMENT_PATH=update-mail/PostBird-MatePad-v${VERSION_NAME}-code${VERSION_CODE}.apk.bin" >> "$GITHUB_ENV"

      - name: Send update mail
        env:
          QQ_MAIL_USERNAME: ${{ secrets.QQ_MAIL_USERNAME }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          QQ_MAIL_TO: ${{ secrets.QQ_MAIL_TO }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          ATTACHMENT_PATH: ${{ env.ATTACHMENT_PATH }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          import sys
          import time
          from email.message import EmailMessage
          from pathlib import Path

          username = os.environ.get("QQ_MAIL_USERNAME", "").strip()
          password = os.environ.get("QQ_MAIL_AUTH_CODE", "").strip().replace(" ", "")
          recipient = (os.environ.get("QQ_MAIL_TO") or username).strip()
          version_name = os.environ.get("VERSION_NAME", "").strip()
          version_code = os.environ.get("VERSION_CODE", "").strip()
          attachment_path = Path(os.environ.get("ATTACHMENT_PATH", ""))

          if not username:
              raise SystemExit("QQ_MAIL_USERNAME is empty")
          if not password:
              raise SystemExit("QQ_MAIL_AUTH_CODE is empty")
          if not recipient:
              raise SystemExit("QQ_MAIL_TO is empty")
          if not attachment_path.exists():
              raise SystemExit(f"Attachment not found: {attachment_path}")

          subject = f"PostBirdFrame Update v{version_name} code={version_code}"
          body = "\n".join([
              f"versionName={version_name}",
              f"versionCode={version_code}",
              f"package={attachment_path.name}",
              "source=GitHub Actions",
          ])

          message = EmailMessage()
          message["From"] = username
          message["To"] = recipient
          message["Subject"] = subject
          message.set_content(body)
          message.add_attachment(
              attachment_path.read_bytes(),
              maintype="application",
              subtype="octet-stream",
              filename=attachment_path.name,
          )

          def send_with_ssl():
              with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=120, context=ssl.create_default_context()) as smtp:
                  smtp.ehlo()
                  smtp.login(username, password)
                  smtp.send_message(message)

          def send_with_starttls():
              with smtplib.SMTP("smtp.qq.com", 587, timeout=120) as smtp:
                  smtp.ehlo()
                  smtp.starttls(context=ssl.create_default_context())
                  smtp.ehlo()
                  smtp.login(username, password)
                  smtp.send_message(message)

          errors = []
          for sender_name, sender in [("SSL-465", send_with_ssl), ("STARTTLS-587", send_with_starttls)]:
              try:
                  print(f"Trying QQ SMTP {sender_name}...")
                  sender()
                  print(f"QQ update mail sent by {sender_name}")
                  sys.exit(0)
              except Exception as exc:
                  errors.append(f"{sender_name}: {exc.__class__.__name__}: {exc}")
                  print(errors[-1])
                  time.sleep(2)

          raise SystemExit("QQ SMTP send failed. " + " | ".join(errors))
          PY