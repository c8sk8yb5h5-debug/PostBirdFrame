name: Release MatePad APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: matepad-v1.1.0

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build MatePad debug APK
        run: gradle -p matepad-app assembleDebug

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp matepad-app/app/build/outputs/apk/debug/*.apk release/PostBird-MatePad-latest.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: release/PostBird-MatePad-latest.apk
