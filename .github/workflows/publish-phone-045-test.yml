name: Publish Phone 0.4.7 Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-phone-045-test.yml"

permissions:
  contents: read

jobs:
  publish-phone-045-test:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger note
        run: echo "Trigger 0.4.7 test workflow."

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Patch version
        working-directory: mobile-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for file, pairs in {
            'app/build.gradle.kts': [('versionCode = 4','versionCode = 11'), ('versionName = "0.4.0"','versionName = "0.4.7"')],
            'app/src/main/java/com/postbird/mobile/PhoneUpdateRules.kt': [('CURRENT_VERSION_CODE = 4','CURRENT_VERSION_CODE = 11'), ('CURRENT_VERSION_NAME = "0.4.0"','CURRENT_VERSION_NAME = "0.4.7"')]
          }.items():
              p = Path(file)
              s = p.read_text()
              for a,b in pairs:
                  s = s.replace(a,b)
              p.write_text(s)
          PY

      - name: Restore keystore
        working-directory: mobile-app
        run: |
          echo "${{ secrets.POSTBIRD_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks
          cat > release-signing.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.POSTBIRD_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.POSTBIRD_KEY_ALIAS }}
          keyPassword=${{ secrets.POSTBIRD_KEY_PASSWORD }}
          EOF

      - name: Build release
        working-directory: mobile-app
        run: gradle clean assembleRelease

      - name: Package files
        id: info
        run: |
          mkdir -p release-output
          APK_NAME="PostBird-Phone-v0.4.7-code11.apk"
          BIN_NAME="PostBird-Phone-v0.4.7-code11.apk.bin"
          cp mobile-app/app/build/outputs/apk/release/app-release.apk "release-output/$APK_NAME"
          cp mobile-app/app/build/outputs/apk/release/app-release.apk "release-output/$BIN_NAME"
          SHA256=$(sha256sum "release-output/$APK_NAME" | awk '{print $1}')
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Send QQ mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.QQ_MAIL_USERNAME }}
          password: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          subject: "PostBirdFrame Phone Update v0.4.7 code=11"
          to: ${{ secrets.QQ_MAIL_TO }}
          from: ${{ secrets.QQ_MAIL_USERNAME }}
          attachments: release-output/${{ steps.info.outputs.bin }}
          body: |
            platform=phone
            applicationId=com.postbird.mobile
            delivery=qq_email_attachment_bin
            signing=release
            versionName=0.4.7
            versionCode=11
            attachmentName=${{ steps.info.outputs.bin }}
            originalApkName=${{ steps.info.outputs.apk }}
            sha256=${{ steps.info.outputs.sha }}
            forceUpdate=false
            releaseNotes=手机端邮箱更新测试版本 0.4.7。

      - uses: actions/upload-artifact@v4
        with:
          name: postbird-phone-047-test
          path: release-output/
