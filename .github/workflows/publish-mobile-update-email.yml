name: Publish Mobile Update Email

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/publish-mobile-update-email.yml"

permissions:
  contents: write

jobs:
  publish-mobile-update-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Patch phone version for updater verification
        working-directory: mobile-app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('versionCode = 4', 'versionCode = 7')
          s = s.replace('versionName = "0.4.0"', 'versionName = "0.4.3"')
          p.write_text(s)
          r = Path('app/src/main/java/com/postbird/mobile/PhoneUpdateRules.kt')
          t = r.read_text()
          t = t.replace('CURRENT_VERSION_CODE = 4', 'CURRENT_VERSION_CODE = 7')
          t = t.replace('CURRENT_VERSION_NAME = "0.4.0"', 'CURRENT_VERSION_NAME = "0.4.3"')
          r.write_text(t)
          PY

      - name: Restore shared PostBird release keystore
        working-directory: mobile-app
        shell: bash
        run: |
          if [ -z "${{ secrets.POSTBIRD_KEYSTORE_BASE64 }}" ]; then
            echo "POSTBIRD_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "${{ secrets.POSTBIRD_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks
          cat > release-signing.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.POSTBIRD_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.POSTBIRD_KEY_ALIAS }}
          keyPassword=${{ secrets.POSTBIRD_KEY_PASSWORD }}
          EOF

      - name: Build signed mobile release APK
        working-directory: mobile-app
        run: gradle clean assembleRelease

      - name: Prepare mobile update package
        id: release_info
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' mobile-app/app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' mobile-app/app/build.gradle.kts)
          TAG="phone-v${VERSION_NAME}-code${VERSION_CODE}"
          APK_NAME="PostBird-Phone-v${VERSION_NAME}-code${VERSION_CODE}.apk"
          BIN_NAME="PostBird-Phone-v${VERSION_NAME}-code${VERSION_CODE}.apk.bin"
          mkdir -p release-output releases/mobile
          cp mobile-app/app/build/outputs/apk/release/app-release.apk "release-output/${APK_NAME}"
          cp mobile-app/app/build/outputs/apk/release/app-release.apk "release-output/${BIN_NAME}"
          SHA256=$(sha256sum "release-output/${APK_NAME}" | awk '{print $1}')
          cat > releases/mobile/latest.json <<EOF
          {
            "platform": "phone",
            "applicationId": "com.postbird.mobile",
            "delivery": "qq_email_attachment_bin",
            "signing": "release",
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "attachmentName": "${BIN_NAME}",
            "originalApkName": "${APK_NAME}",
            "sha256": "${SHA256}",
            "forceUpdate": false,
            "releaseNotes": "手机端邮箱内更新加速验证版本 ${VERSION_NAME}，APK 已作为 .apk.bin 邮件附件发送。"
          }
          EOF
          cat > release-output/postbird-phone-update-email.txt <<EOF
          platform=phone
          applicationId=com.postbird.mobile
          delivery=qq_email_attachment_bin
          signing=release
          versionName=${VERSION_NAME}
          versionCode=${VERSION_CODE}
          attachmentName=${BIN_NAME}
          originalApkName=${APK_NAME}
          sha256=${SHA256}
          forceUpdate=false
          releaseNotes=手机端邮箱内更新加速验证版本 ${VERSION_NAME}，APK 已作为 .apk.bin 邮件附件发送。
          EOF
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "bin_name=${BIN_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release backup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          APK_PATH="release-output/${{ steps.release_info.outputs.apk_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" --title "PostBird Phone ${{ steps.release_info.outputs.version_name }}" --notes "手机端邮箱内更新加速验证版本 ${{ steps.release_info.outputs.version_name }}。邮箱更新以 .apk.bin 附件为准，GitHub Release 仅作为备份。"
          fi

      - name: Commit latest.json
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/mobile/latest.json
          if git diff --cached --quiet; then
            echo "latest.json unchanged"
          else
            git commit -m "Update phone updater speed verification manifest"
            git pull --rebase origin main || true
            git push || echo "latest.json push skipped; email delivery will continue"
          fi

      - name: Send QQ update email with signed APK bin attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.QQ_MAIL_USERNAME }}
          password: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          subject: "PostBirdFrame Phone Update v${{ steps.release_info.outputs.version_name }} code=${{ steps.release_info.outputs.version_code }}"
          to: ${{ secrets.QQ_MAIL_TO }}
          from: ${{ secrets.QQ_MAIL_USERNAME }}
          attachments: release-output/${{ steps.release_info.outputs.bin_name }}
          body: |
            platform=phone
            applicationId=com.postbird.mobile
            delivery=qq_email_attachment_bin
            signing=release
            versionName=${{ steps.release_info.outputs.version_name }}
            versionCode=${{ steps.release_info.outputs.version_code }}
            attachmentName=${{ steps.release_info.outputs.bin_name }}
            originalApkName=${{ steps.release_info.outputs.apk_name }}
            sha256=${{ steps.release_info.outputs.sha256 }}
            forceUpdate=false
            releaseNotes=手机端邮箱内更新加速验证版本 ${{ steps.release_info.outputs.version_name }}，APK 已作为 .apk.bin 邮件附件发送。

      - name: Upload signed update artifact
        uses: actions/upload-artifact@v4
        with:
          name: postbird-phone-signed-update-package
          path: release-output/
