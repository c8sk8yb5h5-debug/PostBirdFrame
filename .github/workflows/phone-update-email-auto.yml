name: Phone Update Email Auto

on:
  workflow_dispatch:

env:
  PHONE_VERSION_CODE: ${{ github.run_number }}
  PHONE_VERSION_NAME: 0.5.${{ github.run_number }}

jobs:
  send-phone-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore keystore
        working-directory: mobile-app
        run: |
          echo "${{ secrets.POSTBIRD_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks
          cat > release-signing.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.POSTBIRD_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.POSTBIRD_KEY_ALIAS }}
          keyPassword=${{ secrets.POSTBIRD_KEY_PASSWORD }}
          EOF

      - name: Build
        run: gradle -p mobile-app clean assembleRelease -PphoneVersionCode=$PHONE_VERSION_CODE -PphoneVersionName=$PHONE_VERSION_NAME

      - name: Package
        id: pkg
        run: |
          mkdir -p release-output
          APK_NAME="PostBird-Phone-v${PHONE_VERSION_NAME}-code${PHONE_VERSION_CODE}.apk"
          BIN_NAME="PostBird-Phone-v${PHONE_VERSION_NAME}-code${PHONE_VERSION_CODE}.apk.bin"
          cp mobile-app/app/build/outputs/apk/release/app-release.apk "release-output/$APK_NAME"
          cp mobile-app/app/build/outputs/apk/release/app-release.apk "release-output/$BIN_NAME"
          SHA256=$(sha256sum "release-output/$APK_NAME" | awk '{print $1}')
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.QQ_MAIL_USERNAME }}
          password: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          subject: "PostBirdFrame Phone Update v${{ env.PHONE_VERSION_NAME }} code=${{ env.PHONE_VERSION_CODE }}"
          to: ${{ secrets.QQ_MAIL_TO }}
          from: ${{ secrets.QQ_MAIL_USERNAME }}
          attachments: release-output/${{ steps.pkg.outputs.bin }}
          body: |
            platform=phone
            applicationId=com.postbird.mobile
            delivery=qq_email_attachment_bin
            signing=release
            versionName=${{ env.PHONE_VERSION_NAME }}
            versionCode=${{ env.PHONE_VERSION_CODE }}
            attachmentName=${{ steps.pkg.outputs.bin }}
            originalApkName=${{ steps.pkg.outputs.apk }}
            sha256=${{ steps.pkg.outputs.sha }}
            forceUpdate=false

      - uses: actions/upload-artifact@v4
        with:
          name: postbird-phone-update-package
          path: release-output/
