name: Publish Phone 0.4.8 Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-phone-045-test.yml"

permissions:
  contents: read

jobs:
  publish-phone-048-test:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger note
        run: echo "Auto trigger 0.4.8 after restoring valid workflow."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Patch phone version
        working-directory: mobile-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('versionCode = 4', 'versionCode = 12')
          s = s.replace('versionName = "0.4.0"', 'versionName = "0.4.8"')
          p.write_text(s)
          r = Path('app/src/main/java/com/postbird/mobile/PhoneUpdateRules.kt')
          t = r.read_text()
          t = t.replace('CURRENT_VERSION_CODE = 4', 'CURRENT_VERSION_CODE = 12')
          t = t.replace('CURRENT_VERSION_NAME = "0.4.0"', 'CURRENT_VERSION_NAME = "0.4.8"')
          r.write_text(t)
          PY

      - name: Restore release keystore
        working-directory: mobile-app
        run: |
          echo "${{ secrets.POSTBIRD_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks
          cat > release-signing.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.POSTBIRD_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.POSTBIRD_KEY_ALIAS }}
          keyPassword=${{ secrets.POSTBIRD_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: mobile-app
        run: gradle clean assembleRelease

      - name: Prepare package
        id: pkg
        run: |
          mkdir -p release-output
          APK_NAME="PostBird-Phone-v0.4.8-code12.apk"
          BIN_NAME="PostBird-Phone-v0.4.8-code12.apk.bin"
          cp mobile-app/app/build/outputs/apk/release/app-release.apk "release-output/$APK_NAME"
          cp mobile-app/app/build/outputs/apk/release/app-release.apk "release-output/$BIN_NAME"
          SHA256=$(sha256sum "release-output/$APK_NAME" | awk '{print $1}')
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Send QQ update email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.QQ_MAIL_USERNAME }}
          password: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          subject: "PostBirdFrame Phone Update v0.4.8 code=12"
          to: ${{ secrets.QQ_MAIL_TO }}
          from: ${{ secrets.QQ_MAIL_USERNAME }}
          attachments: release-output/${{ steps.pkg.outputs.bin }}
          body: |
            platform=phone
            applicationId=com.postbird.mobile
            delivery=qq_email_attachment_bin
            signing=release
            versionName=0.4.8
            versionCode=12
            attachmentName=${{ steps.pkg.outputs.bin }}
            originalApkName=${{ steps.pkg.outputs.apk }}
            sha256=${{ steps.pkg.outputs.sha }}
            forceUpdate=false
            releaseNotes=PostBird Phone 0.4.8 attachment matching fix.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: postbird-phone-048-test
          path: release-output/
