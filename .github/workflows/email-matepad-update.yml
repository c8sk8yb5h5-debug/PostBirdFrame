name: Email MatePad Update APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'matepad-app/**'
      - '.github/workflows/email-matepad-update.yml'

jobs:
  email-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle -p matepad-app assembleRelease
      - name: Sign release APK
        env:
          KS_DATA: ${{ secrets.POSTBIRD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.POSTBIRD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POSTBIRD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.POSTBIRD_KEY_PASSWORD }}
        run: |
          echo "$KS_DATA" | base64 -d > postbird-release.jks
          UNSIGNED=$(ls matepad-app/app/build/outputs/apk/release/*unsigned*.apk | head -n 1)
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" PostBird-MatePad-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks postbird-release.jks --ks-pass pass:$KS_PASS --ks-key-alias $KEY_ALIAS --key-pass pass:$KEY_PASS --out PostBird-MatePad-signed.apk PostBird-MatePad-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose PostBird-MatePad-signed.apk
      - name: Prepare mail attachment
        run: |
          mkdir -p update-mail
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' matepad-app/app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' matepad-app/app/build.gradle.kts | head -n 1)
          cp PostBird-MatePad-signed.apk "update-mail/PostBird-MatePad-v${VERSION_NAME}-code${VERSION_CODE}.apk.bin"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ATTACHMENT_PATH=update-mail/PostBird-MatePad-v${VERSION_NAME}-code${VERSION_CODE}.apk.bin" >> "$GITHUB_ENV"
      - name: Send update mail
        env:
          QQ_MAIL_USERNAME: ${{ secrets.QQ_MAIL_USERNAME }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          QQ_MAIL_TO: ${{ secrets.QQ_MAIL_TO }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          ATTACHMENT_PATH: ${{ env.ATTACHMENT_PATH }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl, sys, time
          from email.message import EmailMessage
          from pathlib import Path
          username = os.environ.get("QQ_MAIL_USERNAME", "").strip()
          password = os.environ.get("QQ_MAIL_AUTH_CODE", "").strip().replace(" ", "")
          recipient = (os.environ.get("QQ_MAIL_TO") or username).strip()
          version_name = os.environ.get("VERSION_NAME", "").strip()
          version_code = os.environ.get("VERSION_CODE", "").strip()
          attachment_path = Path(os.environ.get("ATTACHMENT_PATH", ""))
          message = EmailMessage()
          message["From"] = username
          message["To"] = recipient
          message["Subject"] = f"PostBirdFrame Update v{version_name} code={version_code}"
          message.set_content("\n".join([f"versionName={version_name}", f"versionCode={version_code}", f"package={attachment_path.name}", "signing=release"] ))
          message.add_attachment(attachment_path.read_bytes(), maintype="application", subtype="octet-stream", filename=attachment_path.name)
          for port, use_ssl in [(465, True), (587, False)]:
              try:
                  if use_ssl:
                      smtp = smtplib.SMTP_SSL("smtp.qq.com", port, timeout=120, context=ssl.create_default_context())
                  else:
                      smtp = smtplib.SMTP("smtp.qq.com", port, timeout=120); smtp.starttls(context=ssl.create_default_context())
                  with smtp:
                      smtp.login(username, password); smtp.send_message(message)
                  sys.exit(0)
              except Exception as exc:
                  print(type(exc).__name__, exc); time.sleep(2)
          raise SystemExit("QQ SMTP send failed")
          PY